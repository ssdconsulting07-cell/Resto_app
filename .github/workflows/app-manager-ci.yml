name: App Manager CI
on:
  push:
    branches: [main, preprod, staging, develop]
    paths: ["app-manager/**"]
  pull_request:
    branches: [main, preprod, staging, develop]
    paths: ["app-manager/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app-manager/package-lock.json
      - run: npm ci
      - run: npm run build
